name: Bug report
description: Report a reproducible problem with Window Guard
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Window Guard problem. Please review diagnostic output before posting it because window titles can contain private information.
  - type: input
    id: version
    attributes:
      label: Window Guard version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How are you running Window Guard?
      options:
        - Compiled WindowGuard.exe
        - Python source
    validations:
      required: true
  - type: input
    id: protected_app
    attributes:
      label: Application being protected
      placeholder: "firefox.exe"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give clear numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic output
      description: Optional. Remove private window titles or paths before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the report and removed passwords, PINs, tokens, and other sensitive information.
          required: true
